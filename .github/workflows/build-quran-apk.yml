name: Build Wardi debug APK (quran-page-redesign)

on:
  push:
    branches: [quran-page-redesign]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Make sure sharp is available
        run: node -e "import('sharp').then(()=>process.exit(0),()=>process.exit(1))" || npm install --no-save sharp

      - name: Download the 604 Madani mushaf page images (WebP)
        run: node scripts/download-pages.mjs

      - name: Build the web app
        run: npm run build

      - name: Sync Capacitor android project
        run: npx cap sync android

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK with a friendly name
        run: cp android/app/build/outputs/apk/debug/app-debug.apk wardi-1.2.0-quran-redesign-debug.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wardi-1.2.0-quran-redesign-debug
          path: wardi-1.2.0-quran-redesign-debug.apk

      - name: Attach APK to a CI pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ci-quran-page-redesign
          name: Wardi 1.2.0 - Quran page redesign (debug build)
          body: Automated debug build of the quran-page-redesign branch. Debug key - export a backup before replacing an installed copy, then uninstall, install this APK and import the backup.
          prerelease: true
          files: wardi-1.2.0-quran-redesign-debug.apk
